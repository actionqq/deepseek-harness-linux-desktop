# Build the Linux desktop artifacts for a tagged downstream release.
# The fork tracks upstream releases; see apps/desktop/docs/linux-desktop.md.
name: Linux desktop

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or tag to build
        required: false
        default: linux
  push:
    tags:
      - 'linux-v*'

concurrency:
  group: linux-desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      # .env.linux is gitignored, so CI supplies the same public application identifier.
      DSH_DESKTOP_APP_ID: com.deepseek.dsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        # Corepack activates the packageManager version pinned in package.json.
        run: |
          corepack enable
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate the Linux packaging environment
        run: pnpm --filter @deepseek-ai/dsh-desktop run check:package -- linux-x64

      - name: Package AppImage
        run: pnpm run package:desktop:linux:x64:unsigned

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-harness-linux-x64
          path: apps/desktop/.desktop-build/targets/linux-x64/unsigned-artifacts/*.AppImage
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/linux-v')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/desktop/.desktop-build/targets/linux-x64/unsigned-artifacts/*.AppImage
          fail_on_unmatched_files: true
